<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Wächter gegen Brecher</title>
<style>
  body { margin: 0; background: #120e0c; color: #ece0c4; font: 15px/1.4 sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: #c8b48a; }
  figure { margin: 22px 0; }
  img { width: 100%; height: auto; image-rendering: pixelated; background: #000; }
  figcaption { margin-top: 6px; color: #d4c4a8; }
</style>
</head>
<body>
<main>
  <h1>Wächter gegen Brecher</h1>
  <p>12 Kleinanimationen, je 60 Frames bei 10 Bildern pro Sekunde. Ablauf vorwärts, der Log war rückwärts notiert.</p>
  <figure><img src="01_runde1_austausch.gif" alt="Runde 1"><figcaption>Runde 1 · Austausch. 1 Körper gegen 2 Körper, 1 Bruch.</figcaption></figure>
  <figure><img src="02_runde2_verfehlen.gif" alt="Runde 2"><figcaption>Runde 2 · Wächter verfehlt. Brecher 2 Körper, 1 Bruch.</figcaption></figure>
  <figure><img src="03_runde3_nachsetzen.gif" alt="Runde 3"><figcaption>Runde 3 · Nachsetzen. 1 Körper gegen 1 Körper, 1 Bruch.</figcaption></figure>
  <figure><img src="04_runde4_ausweichen.gif" alt="Runde 4"><figcaption>Runde 4 · Ausweichen. Treffer −2, 0 Körper, 0 Bruch.</figcaption></figure>
  <figure><img src="05_runde5_nur_brecher.gif" alt="Runde 5"><figcaption>Runde 5 · Wächter verfehlt. Brecher 1 Körper.</figcaption></figure>
  <figure><img src="06_runde6_blockhaltung.gif" alt="Runde 6"><figcaption>Runde 6 · Verfehlen und Blockhaltung. Erster Treffer −4.</figcaption></figure>
  <figure><img src="07_runde7_leicht.gif" alt="Runde 7"><figcaption>Runde 7 · leichter Tausch. 1 Körper gegen 1 Körper.</figcaption></figure>
  <figure><img src="08_runde8_brecher_zurueck.gif" alt="Runde 8"><figcaption>Runde 8 · Brecher +0 Energie, trifft trotzdem für 2 Körper, 1 Bruch.</figcaption></figure>
  <figure><img src="09_runde9_block.gif" alt="Runde 9"><figcaption>Runde 9 · Schlag geblockt. Block −4, 0 / 0.</figcaption></figure>
  <figure><img src="10_runde10_offen.gif" alt="Runde 10"><figcaption>Runde 10 · Offen +1. Brecher 3 Körper, 2 Bruch.</figcaption></figure>
  <figure><img src="11_runde11_finale.gif" alt="Runde 11"><figcaption>Runde 11 · letzter Tausch, danach kippt der Wächter.</figcaption></figure>
  <figure><img src="12_zusammenbruch.gif" alt="Zusammenbruch"><figcaption>Wächter bricht zusammen. 15 Körper, 8 Bruch im ganzen Kampf.</figcaption></figure>
</main>
</body>
</html>
